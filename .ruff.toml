[tool.ruff]
# Line length
line-length = 100

# Target Python version
target-version = "py310"

# Select rules
select = [
    # pycodestyle errors and warnings
    "E",
    "W",
    
    # Pyflakes
    "F",
    
    # isort
    "I",
    
    # flake8-bugbear
    "B",
    
    # flake8-comprehensions
    "C4",
    
    # pyupgrade
    "UP",
    
    # flake8-quotes
    "Q",
    
    # flake8-annotations
    "ANN",
    
    # flake8-bandit (security)
    "S",
    
    # flake8-pie
    "PIE",
    
    # flake8-simplify
    "SIM",
    
    # flake8-type-checking
    "TCH",
    
    # flake8-pytest-style
    "PT",
    
    # flake8-raise
    "RSE",
]

# Ignore rules
ignore = [
    # Line too long (handled by black)
    "E501",
    
    # Do not perform function calls in argument defaults
    "B008",
    
    # Missing type hints for module level variables
    "ANN001",
    
    # Missing return type annotation for public function
    "ANN201",
    
    # Use of `print` found
    "T201",
    
    # `subprocess.run` without `check=True`
    # Descomentar cuando se corrija todo el código
    # "TCH002",
]

# Fixable rules
fixable = ["ALL"]
unfixable = []

# Auto-fix
fix = true

[tool.ruff.format]
# Use Black-compatible formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.isort]
known-first-party = ["voxforge", "gui"]
known-third-party = [
    "PySide6",
    "coqui_tts",
    "librosa",
    "soundfile",
    "numpy",
    "pymupdf",
    "pytesseract",
    "pydantic",
]

[tool.ruff.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.ruff.per-file-ignores]
# Ignorar reglas específicas para ciertos archivos
"voxforge/gui.py" = [
    "ANN201",  # Missing return type (GUI callbacks)
    "ANN001",  # Missing type for module variable
]
"tests/*" = [
    "ANN201",  # Tests can have no return type
    "S101",    # assert is fine in tests
]
